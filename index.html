<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mensaje</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
 <style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
  }
  .imagen-contenedor {
    position: relative;
    display: inline-block;
    margin-top: 15px;
  }
  .imagen-principal {
    max-width: 95%;
    height: auto;
    border-radius: 10px;
    display: block;
    margin: 0 auto;
  }
  .captura-chica {
    position: absolute;
    bottom: -25px;
    left: 50%;
    transform: translateX(-50%);
    width: 40%;
    max-width: 220px;
    height: auto;
    border-radius: 8px;
    border: 3px solid white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>
  <h3>Dude, se que no soy detallista ni tengo ni originalidad y menos plata para regalos pero espero te guste esta flor</h3>
  <h2>Te amo esposa mia, gracias por hacerme tan feliz</h2>

  <div class="imagen-contenedor">
    <img class="imagen-principal" src="Mundo De Gumball.jpeg" alt="Imagen">
    <img class="captura-chica" src="Captura de pantalla 2026-09-21 211756.png" alt="Captura">
  </div>
</body>
</html>
