<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mensaje</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .imagen-contenedor {
      position: relative;
      display: inline-block;
      margin-top: 15px;
    }
    .imagen-principal {
      max-width: 80%;
      height: auto;
      border-radius: 10px;
      display: block;
      margin: 0 auto;
    }
    .captura-chica {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 25%;
      max-width: 150px;
      height: auto;
      border-radius: 8px;
      border: 3px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <h2>Dude, se que no soy detallista ni tengo ni originalidad y menos plata para regalos pero espero te guste esta flor fiera</h2>
  <p>Te amo esposa mia, gracias por hacerme tan feliz</p>

  <div class="imagen-contenedor">
    <img class="imagen-principal" src="Mundo De Gumball.jpeg" alt="Imagen">
    <img class="captura-chica" src="Captura de pantalla 2026-09-21 211756.png" alt="Captura">
  </div>
</body>
</html>
